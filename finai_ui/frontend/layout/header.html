<style>
/* PETA TOP NAV — outside sidebar, inside the FinAI component shell. */
.desktop-topnav{position:absolute;top:0;left:250px;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 28px;background:#fff;border-bottom:1px solid #edf0ef;box-shadow:0 3px 12px rgba(0,0,0,.035);z-index:1800}
