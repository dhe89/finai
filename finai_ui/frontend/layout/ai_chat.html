<style>
  /* PETA chat belongs to the FinAI main container, not the browser viewport. */
  #finai-root > .ai {
    position: absolute !important;
    top: var(--finai-ai-top, 0px) !important;
    right: 0 !important;
    bottom: auto !important;
    height: var(--finai-ai-height, 100%) !important;
    max-height: var(--finai-ai-height, 100%) !important;
    z-index: 1500 !important;
  }

  /* Single AI launcher. Desktop stays inside the FinAI shell and is raised
     above the previous position while remaining below the header area. */
  #finai-root > #floatingAI {
    position: absolute !important;
    right: 24px !important;
    top: 30% !important;
    bottom: auto !important;
    transform: translateY(-50%) !important;
    background: #b7f51d !important;
    color: #005642 !important;
  }

  #finai-root > #floatingAI:hover {
    transform: translateY(calc(-50% - 1px)) !important;
    background: #005642 !important;
    color: #b7f51d !important;
  }

  #finai-root > #floatingAI:active {
    transform: translateY(-50%) scale(.97) !important;
  }

  #finai-root > #floatingAI .floating-ai-icon {
    color: currentColor !important;
  }

  /* Floating launcher is available only while the assistant is closed. */
  #finai-root > .ai:not(.closed) ~ #floatingAI {
    display: none !important;
  }

  @media (max-width: 800px) {
    #finai-root > .ai {
      width: min(410px, 100%) !important;
    }

    /* Mobile remains viewport-fixed, but is raised to the same visual zone
       requested for desktop rather than sitting close to the bottom edge. */
    #finai-root > #floatingAI {
      position: fixed !important;
      right: 16px !important;
      top: 62% !important;
      bottom: auto !important;
      transform: translateY(-50%) !important;
      background: #b7f51d !important;
      color: #005642 !important;
    }

    #finai-root > #floatingAI:hover {
      transform: translateY(calc(-50% - 1px)) !important;
      background: #005642 !important;
      color: #b7f51d !important;
    }

    #finai-root > #floatingAI:active {
      transform: translateY(-50%) scale(.97) !important;
    }
  }
</style>

<aside id="ai" class="ai closed" aria-hidden="true">
  <div class="ai-head">
    <div>
      <div class="ai-title">Tanya PETA - AI Assistant</div>
      <div class="ai-status"><span class="dot"></span>Ready to assist</div>
    </div>
    <button id="aiClose" class="ai-close" aria-label="Close AI Assistant">×</button>
  </div>
  <div id="chatBody" class="ai-body">
    {{CHAT_MESSAGES}}
  </div>
  <div class="ai-foot">
    <div class="ai-foot-row">
      <input id="chatInput" class="chat-input" type="text" autocomplete="off" placeholder="Write a message..." aria-label="Write a message">
      <button id="sendChat" class="send" type="button" aria-label="Send message" title="Send message">➤</button>
    </div>
  </div>
</aside>

<button id="floatingAI" class="floating-ai" aria-label="Open AI Assistant" title="Open AI Assistant" type="button">
  <span class="floating-ai-icon">✦</span>
</button>
